[project]
name = "redherring"
version = "0.1.0"
description = "Controlled distractor studies in RAG."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "pyyaml",
    "requests",
    "tqdm",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
gpu = ["vllm>=0.8.5", "sentence-transformers>=3.0"]   # vllm brings torch, transformers, huggingface_hub

[project.scripts]
rh = "redherring.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redherring"]

[tool.basedpyright]
typeCheckingMode = "off"         # keeps undefined-name/syntax errors, drops type complaints
reportMissingImports = false     # vllm/torch are only installed on the GPU machine
venvPath = "."
venv = ".venv"
